name: Deploy to Farmedia Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Check FTP deployment secrets
        id: check_secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) belum dikonfigurasi. Deploy otomatis dilewati sampai Secrets ditambahkan di GitHub."
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        if: steps.check_secrets.outputs.ready == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer production dependencies
        if: steps.check_secrets.outputs.ready == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Prepare temporary environment for Vite & Wayfinder build
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --no-interaction

      - name: Install NPM dependencies & build production assets
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Clean up temporary build files before upload
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          rm -f .env database/database.sqlite
          rm -rf node_modules
          rm -rf public/hot
          rm -rf public/storage
          rm -rf storage/logs/*.log
          rm -rf storage/framework/views/*.php

      - name: Deploy to DirectAdmin via FTPS
        if: steps.check_secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.agents/**
            **/.vscode/**
            **/.sokudo/**
            **/node_modules/**
            .env
            .env.*
            storage/**
            public/storage
            public/storage/**
            public/hot
            database/database.sqlite
            tests/**
            scratch/**
            *.zip
            *.sql
            AGENTS.md
            PRD.md
            ARCHITECTURE.md
            DESIGN.md
